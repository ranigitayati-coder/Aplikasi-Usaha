<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Aplikasi Usaha</title>

<link rel="manifest" href="manifest.json">

<style>
body {
  max-width: 900px;
  margin: auto;
  font-family: Arial;
}
input, select, button {
  width: 100%;
  padding: 6px;
  margin: 3px 0;
}
button {
  background: black;
  color: white;
  border: none;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}
th, td {
  border: 1px solid #ccc;
  padding: 6px;
}
th {
  background: #f0f0f0;
}
.section {
  margin-bottom: 25px;
}
</style>
</head>

<body>

<div class="section">
<h2>📦 Stok Bahan</h2>

<input id="namaBahan" placeholder="Nama bahan">
<input id="qtyBahan" type="number" placeholder="Jumlah stok">

<select id="satuanBahan">
<option>gram</option>
<option>ml</option>
<option>pcs</option>
</select>

<input id="beliBahan" type="number" placeholder="Jumlah beli">
<select id="satuanBeliBahan">
<option>kg</option>
<option>liter</option>
<option>pcs</option>
</select>

<input id="hargaBahan" type="number" placeholder="Harga beli">

<button onclick="simpanStok()">💾 Simpan</button>

<div id="stokList"></div>
</div>

<div class="section">
<h2>🍹 Produk</h2>

<input id="namaProduk" placeholder="Nama produk">
<input id="hargaProduk" type="number" placeholder="Harga jual">
<button onclick="simpanProduk()">💾 Simpan Produk</button>

<div id="produkList"></div>

<h3>✏️ Edit Resep</h3>
<div id="resepList"></div>
<button onclick="tambahResep()">+ Tambah Bahan</button>
<button onclick="simpanResep()">💾 Simpan Resep</button>
</div>

<div class="section">
<h2>🛒 Penjualan</h2>
<select id="pilihProduk"></select>
<input id="jumlahJual" type="number" placeholder="Jumlah">
<button onclick="jualProduk()">Proses</button>
</div>

<div class="section">
<h2>📊 Laporan</h2>
<div id="laporan"></div>
<button onclick="resetLaporan()">Reset Harian</button>
</div>

<div class="section">
<h2>📦 Sisa Stok</h2>
<div id="sisaStok"></div>
</div>

<script>
let stok = JSON.parse(localStorage.getItem("stok")) || [];
let produkList = JSON.parse(localStorage.getItem("produkList")) || [];
let riwayat = JSON.parse(localStorage.getItem("riwayat")) || [];

let resepTemp = [];
let editResepIndex = null;

const satuanMap = { gram:1, kg:1000, ml:1, liter:1000, pcs:1 };

function saveAll(){
  localStorage.setItem("stok", JSON.stringify(stok));
  localStorage.setItem("produkList", JSON.stringify(produkList));
  localStorage.setItem("riwayat", JSON.stringify(riwayat));
}

/* ===== STOK ===== */
function simpanStok(){
  let nama = namaBahan.value;
  let qty = Number(qtyBahan.value);
  let satuan = satuanBahan.value;
  let beli = Number(beliBahan.value);
  let satuanBeli = satuanBeliBahan.value;
  let harga = Number(hargaBahan.value);

  if(!nama) return alert("Nama kosong");

  stok.push({nama, qty, satuan, beli, satuanBeli, harga});
  saveAll();
  renderStok();

  namaBahan.value="";
  qtyBahan.value="";
  beliBahan.value="";
  hargaBahan.value="";
}

function renderStok(){
  let html = `<table>
  <tr><th>Nama</th><th>Stok</th><th>Satuan</th><th>Harga</th><th>Aksi</th></tr>`;

  stok.forEach((s,i)=>{
    html += `
    <tr>
      <td><input value="${s.nama}" onchange="stok[${i}].nama=this.value; saveAll();"></td>
      <td><input type="number" value="${s.qty}" onchange="stok[${i}].qty=Number(this.value); saveAll();"></td>
      <td>
        <select onchange="stok[${i}].satuan=this.value; saveAll();">
          <option ${s.satuan=="gram"?"selected":""}>gram</option>
          <option ${s.satuan=="ml"?"selected":""}>ml</option>
          <option ${s.satuan=="pcs"?"selected":""}>pcs</option>
        </select>
      </td>
      <td><input type="number" value="${s.harga}" onchange="stok[${i}].harga=Number(this.value); saveAll();"></td>
      <td><button onclick="hapusStok(${i})">Hapus</button></td>
    </tr>`;
  });

  html += `</table>`;
  stokList.innerHTML = html;
}

function hapusStok(i){
  stok.splice(i,1);
  saveAll();
  renderStok();
}

/* ===== RESEP ===== */
function tambahResep(){
  resepTemp.push({nama:"", qty:0, satuan:"gram"});
  renderResep();
}

function renderResep(){
  let html="";
  resepTemp.forEach((r,i)=>{
    html += `
    <div>
      <select onchange="resepTemp[${i}].nama=this.value">
        <option value="">Pilih bahan</option>
        ${stok.map(s=>`<option value="${s.nama}" ${r.nama==s.nama?"selected":""}>${s.nama}</option>`).join("")}
      </select>

      <input type="number" value="${r.qty}"
        onchange="resepTemp[${i}].qty=Number(this.value)">

      <select onchange="resepTemp[${i}].satuan=this.value">
        <option ${r.satuan=="gram"?"selected":""}>gram</option>
        <option ${r.satuan=="ml"?"selected":""}>ml</option>
        <option ${r.satuan=="pcs"?"selected":""}>pcs</option>
      </select>

      Rp ${Math.round(hitungBiaya(r)).toLocaleString()}

      <button onclick="hapusResep(${i})">X</button>
    </div>`;
  });
  resepList.innerHTML = html;
}

function hapusResep(i){
  resepTemp.splice(i,1);
  renderResep();
}

function editResep(i){
  editResepIndex = i;
  resepTemp = JSON.parse(JSON.stringify(produkList[i].resep || []));
  renderResep();
}

function simpanResep(){
  if(editResepIndex===null) return alert("Pilih produk dulu");

  produkList[editResepIndex].resep = JSON.parse(JSON.stringify(resepTemp));

  saveAll();
  renderProduk();

  resepTemp=[];
  editResepIndex=null;
  renderResep();
}

function hitungBiaya(r){
  let bahan = stok.find(s=>s.nama===r.nama);
  if(!bahan) return 0;

  let pakai = r.qty * satuanMap[r.satuan];
  let beli = bahan.beli * satuanMap[bahan.satuanBeli];

  return pakai * (bahan.harga / beli);
}

/* ===== PRODUK ===== */
function simpanProduk(){
  let nama = namaProduk.value;
  let harga = Number(hargaProduk.value);

  if(!nama) return alert("Nama kosong");

  produkList.push({nama, harga, resep:[]});
  saveAll();
  renderProduk();

  namaProduk.value="";
  hargaProduk.value="";
}

function renderProduk(){
  let html = `<table>
  <tr><th>Nama</th><th>Harga</th><th>HPP</th><th>Aksi</th></tr>`;

  produkList.forEach((p,i)=>{
    let hpp = p.resep.reduce((t,r)=>t+hitungBiaya(r),0);

    html += `
    <tr>
      <td><input value="${p.nama}" onchange="produkList[${i}].nama=this.value; saveAll();"></td>
      <td><input type="number" value="${p.harga}" onchange="produkList[${i}].harga=Number(this.value); saveAll();"></td>
      <td>Rp ${Math.round(hpp).toLocaleString()}</td>
      <td><button onclick="editResep(${i})">Resep</button></td>
    </tr>`;
  });

  html += `</table>`;
  produkListDiv = document.getElementById("produkList");
  produkListDiv.innerHTML = html;

  pilihProduk.innerHTML =
    produkList.map((p,i)=>`<option value="${i}">${p.nama}</option>`).join("");
}

/* ===== PENJUALAN ===== */
function jualProduk(){
  let idx = pilihProduk.value;
  let jumlah = Number(jumlahJual.value);

  let produk = produkList[idx];
  if(!produk) return;

  for(let r of produk.resep){
    let bahan = stok.find(s=>s.nama===r.nama);
    if(!bahan || bahan.qty < r.qty * jumlah){
      return alert("Stok kurang: "+r.nama);
    }
  }

  produk.resep.forEach(r=>{
    let bahan = stok.find(s=>s.nama===r.nama);
    bahan.qty -= r.qty * jumlah;
  });

  let hpp = produk.resep.reduce((t,r)=>t+hitungBiaya(r),0);

  riwayat.push({
    produk: produk.nama,
    qty: jumlah,
    harga: produk.harga,
    hpp: hpp
  });

  saveAll();
  renderStok();
  tampilSisa();
  renderLaporan();
}

/* ===== LAPORAN ===== */
function renderLaporan(){
  let omzet=0, modal=0, qty=0;

  riwayat.forEach(r=>{
    omzet += r.qty*r.harga;
    modal += r.qty*r.hpp;
    qty += r.qty;
  });

  laporan.innerHTML = `
    Total: ${qty}<br>
    Omzet: Rp ${Math.round(omzet).toLocaleString()}<br>
    Modal: Rp ${Math.round(modal).toLocaleString()}<br>
    <b>Profit: Rp ${Math.round(omzet-modal).toLocaleString()}</b>
  `;
}

function resetLaporan(){
  if(confirm("Reset hari ini?")){
    riwayat=[];
    saveAll();
    renderLaporan();
  }
}

/* ===== SISA STOK ===== */
function tampilSisa(){
  let html = `<table>
  <tr><th>Nama</th><th>Sisa</th><th>Satuan</th></tr>`;

  stok.forEach(s=>{
    html += `<tr>
      <td>${s.nama}</td>
      <td>${s.qty}</td>
      <td>${s.satuan}</td>
    </tr>`;
  });

  html += `</table>`;
  sisaStok.innerHTML = html;
}

/* ===== INIT ===== */
renderStok();
renderProduk();
renderResep();
tampilSisa();
renderLaporan();
</script>

</body>
</html>
