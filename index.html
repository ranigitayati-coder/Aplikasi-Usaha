<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Sistem Usaha Multi Produk</title>

<link rel="manifest" href="manifest.json">

<style>
body {
  max-width: 800px;
  margin: auto;
  font-family: Arial;
}
input, select, button {
  width: 100%;
  padding: 6px;
  margin: 3px 0;
}
button {
  background: black;
  color: white;
  border: none;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}
th, td {
  border: 1px solid #ccc;
  padding: 6px;
}
th {
  background: #f0f0f0;
}
</style>
</head>

<body>

<h2>📦 Stok Bahan</h2>

<input id="namaBahan" placeholder="Nama bahan">
<input id="qtyBahan" type="number" placeholder="Jumlah stok">

<select id="satuanBahan">
  <option>gram</option>
  <option>ml</option>
  <option>pcs</option>
</select>

<input id="beliBahan" type="number" placeholder="Jumlah beli">
<select id="satuanBeliBahan">
  <option>kg</option>
  <option>liter</option>
  <option>pcs</option>
</select>

<input id="hargaBahan" type="number" placeholder="Harga beli">

<button onclick="simpanStok()">💾 Simpan Bahan</button>

<div id="stokList"></div>

<hr>

<h2>🍹 Produk</h2>

<input id="namaProduk" placeholder="Nama produk">
<input id="hargaProduk" type="number" placeholder="Harga jual">

<div id="resepList"></div>
<button onclick="tambahResep()">+ Tambah Bahan Resep</button>

<button onclick="simpanProduk()">💾 Simpan Produk</button>

<hr>

<h2>📋 Daftar Produk</h2>
<div id="produkList"></div>

<hr>

<h2>🛒 Penjualan</h2>
<select id="pilihProduk"></select>
<input id="jumlahJual" type="number" placeholder="Jumlah terjual">
<button onclick="jualProduk()">Proses Penjualan</button>

<hr>

<h2>📊 Laporan</h2>
<div id="laporan"></div>
<button onclick="resetLaporan()">🔄 Reset Hari Ini</button>

<hr>

<h2>📦 Sisa Stok</h2>
<div id="sisaStok"></div>

<script>
let stok = JSON.parse(localStorage.getItem("stok")) || [];
let produkList = JSON.parse(localStorage.getItem("produkList")) || [];
let riwayat = JSON.parse(localStorage.getItem("riwayat")) || [];
let resepTemp = [];

const satuanMap = { gram:1, kg:1000, ml:1, liter:1000, pcs:1 };

function saveAll(){
  localStorage.setItem("stok", JSON.stringify(stok));
  localStorage.setItem("produkList", JSON.stringify(produkList));
  localStorage.setItem("riwayat", JSON.stringify(riwayat));
}

/* ===== STOK ===== */
function simpanStok(){
  let nama = namaBahan.value;
  let qty = Number(qtyBahan.value);
  let satuan = satuanBahan.value;
  let beli = Number(beliBahan.value);
  let satuanBeli = satuanBeliBahan.value;
  let harga = Number(hargaBahan.value);

  if(!nama) return alert("Nama kosong");

  stok.push({nama, qty, satuan, beli, satuanBeli, harga});
  saveAll();
  renderStok();

  namaBahan.value="";
  qtyBahan.value="";
  beliBahan.value="";
  hargaBahan.value="";
}

function renderStok(){
  let html = `
  <table>
    <tr>
      <th>Nama</th>
      <th>Stok</th>
      <th>Satuan</th>
      <th>Harga</th>
      <th>Aksi</th>
    </tr>`;

  stok.forEach((s,i)=>{
    html += `
    <tr>
      <td><input value="${s.nama}" onchange="stok[${i}].nama=this.value; saveAll();"></td>
      <td><input type="number" value="${s.qty}" onchange="stok[${i}].qty=Number(this.value); saveAll();"></td>
      <td>
        <select onchange="stok[${i}].satuan=this.value; saveAll();">
          <option ${s.satuan=="gram"?"selected":""}>gram</option>
          <option ${s.satuan=="ml"?"selected":""}>ml</option>
          <option ${s.satuan=="pcs"?"selected":""}>pcs</option>
        </select>
      </td>
      <td><input type="number" value="${s.harga}" onchange="stok[${i}].harga=Number(this.value); saveAll();"></td>
      <td><button onclick="hapusStok(${i})">Hapus</button></td>
    </tr>`;
  });

  html += `</table>`;
  stokList.innerHTML = html;
}

function hapusStok(i){
  stok.splice(i,1);
  saveAll();
  renderStok();
}

/* ===== PRODUK ===== */
function simpanProduk(){
  let nama = namaProduk.value;
  let harga = Number(hargaProduk.value);

  if(!nama) return alert("Nama kosong");

  produkList.push({nama, harga, resep:[]});
  saveAll();
  renderProduk();

  namaProduk.value="";
  hargaProduk.value="";
}

function renderProduk(){
  let html = `
  <table>
    <tr>
      <th>Nama</th>
      <th>Harga</th>
    </tr>`;

  produkList.forEach((p,i)=>{
    html += `
    <tr>
      <td><input value="${p.nama}" onchange="produkList[${i}].nama=this.value; saveAll();"></td>
      <td><input type="number" value="${p.harga}" onchange="produkList[${i}].harga=Number(this.value); saveAll();"></td>
    </tr>`;
  });

  html += `</table>`;
  produkList.innerHTML = html;

  pilihProduk.innerHTML =
    produkList.map((p,i)=>`<option value="${i}">${p.nama}</option>`).join("");
}

/* ===== PENJUALAN ===== */
function jualProduk(){
  let idx = pilihProduk.value;
  let jumlah = Number(jumlahJual.value);

  let produk = produkList[idx];
  if(!produk) return;

  let hpp = 0;

  riwayat.push({
    produk: produk.nama,
    qty: jumlah,
    harga: produk.harga,
    hpp
  });

  saveAll();
  renderLaporan();
}

/* ===== LAPORAN ===== */
function renderLaporan(){
  let omzet=0, modal=0, qty=0;

  riwayat.forEach(r=>{
    omzet += r.qty*r.harga;
    modal += r.qty*r.hpp;
    qty += r.qty;
  });

  laporan.innerHTML = `
    <p>Total: ${qty}</p>
    <p>Omzet: Rp ${omzet.toLocaleString()}</p>
    <p>Profit: Rp ${(omzet-modal).toLocaleString()}</p>
  `;
}

function resetLaporan(){
  if(confirm("Reset?")){
    riwayat=[];
    saveAll();
    renderLaporan();
  }
}

/* ===== INIT ===== */
renderStok();
renderProduk();
renderLaporan();
</script>

</body>
</html>
