<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Sistem Usaha Multi Produk</title>

<link rel="manifest" href="manifest.json">

<style>
body {
  max-width: 500px;
  margin: auto;
  font-family: Arial;
}
input, select, button {
  width: 100%;
  padding: 8px;
  margin: 5px 0;
}
button {
  background: black;
  color: white;
  border: none;
}
.box {
  border:1px solid #ccc;
  padding:10px;
  margin:5px 0;
}
</style>
</head>

<body>

<h2>📦 Stok Bahan</h2>
<p>Masukkan bahan satu per satu lalu simpan</p>

<input id="namaBahan" placeholder="Nama bahan">
<input id="qtyBahan" type="number" placeholder="Jumlah stok">

<select id="satuanBahan">
  <option>gram</option>
  <option>ml</option>
  <option>pcs</option>
</select>

<input id="beliBahan" type="number" placeholder="Jumlah beli">
<select id="satuanBeliBahan">
  <option>kg</option>
  <option>liter</option>
  <option>pcs</option>
</select>

<input id="hargaBahan" type="number" placeholder="Harga beli">

<button onclick="simpanStok()">💾 Simpan Bahan</button>

<div id="stokList"></div>

<hr>

<h2>🍹 Produk</h2>
<p>Buat produk dan tentukan bahan</p>

<input id="namaProduk" placeholder="Nama produk">
<input id="hargaProduk" type="number" placeholder="Harga jual">

<div id="resepList"></div>
<button onclick="tambahResep()">+ Tambah Bahan Resep</button>

<button onclick="simpanProduk()">💾 Simpan Produk</button>

<hr>

<h2>📋 Daftar Produk</h2>
<div id="produkList"></div>

<hr>

<h2>🛒 Penjualan</h2>
<select id="pilihProduk"></select>
<input id="jumlahJual" type="number" placeholder="Jumlah terjual">
<button onclick="jualProduk()">Proses Penjualan</button>

<hr>

<h2>📊 Laporan</h2>
<div id="laporan"></div>
<button onclick="resetLaporan()">🔄 Reset Hari Ini</button>

<hr>

<h2>📦 Sisa Stok</h2>
<div id="sisaStok"></div>

<script>
let stok = JSON.parse(localStorage.getItem("stok")) || [];
let produkList = JSON.parse(localStorage.getItem("produkList")) || [];
let riwayat = JSON.parse(localStorage.getItem("riwayat")) || [];
let resepTemp = [];

const satuanMap = { gram:1, kg:1000, ml:1, liter:1000, pcs:1 };

function saveAll(){
  localStorage.setItem("stok", JSON.stringify(stok));
  localStorage.setItem("produkList", JSON.stringify(produkList));
  localStorage.setItem("riwayat", JSON.stringify(riwayat));
}

/* ===== STOK ===== */
function simpanStok(){
  let nama = document.getElementById("namaBahan").value;
  let qty = Number(document.getElementById("qtyBahan").value);
  let satuan = document.getElementById("satuanBahan").value;
  let beli = Number(document.getElementById("beliBahan").value);
  let satuanBeli = document.getElementById("satuanBeliBahan").value;
  let harga = Number(document.getElementById("hargaBahan").value);

  if(!nama) return alert("Nama bahan kosong");

  stok.push({nama, qty, satuan, beli, satuanBeli, harga});
  saveAll();
  renderStok();

  document.getElementById("namaBahan").value="";
  document.getElementById("qtyBahan").value="";
  document.getElementById("beliBahan").value="";
  document.getElementById("hargaBahan").value="";
}

function renderStok(){
  let html="";
  stok.forEach((s,i)=>{
    html+=`
    <div class="box">
      <b>${s.nama}</b><br>
      Stok: ${s.qty} ${s.satuan}<br>
      Harga: Rp ${s.harga.toLocaleString()}<br>
      <button onclick="hapusStok(${i})">Hapus</button>
    </div>`;
  });
  document.getElementById("stokList").innerHTML=html;
}

function hapusStok(i){
  stok.splice(i,1);
  saveAll();
  renderStok();
}

/* ===== RESEP ===== */
function tambahResep(){
  resepTemp.push({nama:"", qty:0, satuan:"gram"});
  renderResep();
}

function renderResep(){
  let html="";
  resepTemp.forEach((r,i)=>{
    html+=`
    <div class="box">
      <select onchange="resepTemp[${i}].nama=this.value">
        <option value="">Pilih bahan</option>
        ${stok.map(s=>`<option value="${s.nama}">${s.nama}</option>`).join("")}
      </select>

      <input type="number" placeholder="Jumlah pakai"
        onchange="resepTemp[${i}].qty=Number(this.value)">

      <select onchange="resepTemp[${i}].satuan=this.value">
        <option>gram</option>
        <option>ml</option>
        <option>pcs</option>
      </select>

      <button onclick="hapusResep(${i})">Hapus</button>
    </div>`;
  });
  document.getElementById("resepList").innerHTML=html;
}

function hapusResep(i){
  resepTemp.splice(i,1);
  renderResep();
}

/* ===== SIMPAN PRODUK ===== */
function simpanProduk(){
  let nama = document.getElementById("namaProduk").value;
  let harga = Number(document.getElementById("hargaProduk").value);

  if(!nama) return alert("Nama produk kosong");

  produkList.push({
    nama,
    harga,
    resep: JSON.parse(JSON.stringify(resepTemp))
  });

  resepTemp = [];
  document.getElementById("namaProduk").value="";
  document.getElementById("hargaProduk").value="";

  saveAll();
  renderProduk();
  renderResep();
}

/* ===== PRODUK ===== */
function renderProduk(){
  let html="";
  produkList.forEach(p=>{
    html+=`<div class="box">${p.nama} - Rp ${p.harga.toLocaleString()}</div>`;
  });

  document.getElementById("produkList").innerHTML=html;

  document.getElementById("pilihProduk").innerHTML =
    produkList.map((p,i)=>`<option value="${i}">${p.nama}</option>`).join("");
}

/* ===== HITUNG ===== */
function hitungBiaya(r){
  let bahan = stok.find(s=>s.nama===r.nama);
  if(!bahan) return 0;

  let pakai = r.qty * satuanMap[r.satuan];
  let beli = bahan.beli * satuanMap[bahan.satuanBeli];

  return pakai * (bahan.harga / beli);
}

/* ===== PENJUALAN ===== */
function jualProduk(){
  let idx = document.getElementById("pilihProduk").value;
  let jumlah = Number(document.getElementById("jumlahJual").value);

  let produk = produkList[idx];
  if(!produk) return;

  for(let r of produk.resep){
    let bahan = stok.find(s=>s.nama===r.nama);
    if(!bahan || bahan.qty < r.qty * jumlah){
      return alert("Stok kurang: " + r.nama);
    }
  }

  produk.resep.forEach(r=>{
    let bahan = stok.find(s=>s.nama===r.nama);
    bahan.qty -= r.qty * jumlah;
  });

  let hpp = produk.resep.reduce((t,r)=>t+hitungBiaya(r),0);

  riwayat.push({
    produk: produk.nama,
    qty: jumlah,
    harga: produk.harga,
    hpp: hpp
  });

  saveAll();
  renderStok();
  tampilSisa();
  renderLaporan();
}

/* ===== LAPORAN ===== */
function renderLaporan(){
  let omzet=0, modal=0, qty=0;

  riwayat.forEach(r=>{
    omzet += r.qty*r.harga;
    modal += r.qty*r.hpp;
    qty += r.qty;
  });

  let profit = omzet - modal;

  document.getElementById("laporan").innerHTML = `
    <p>Total: ${qty}</p>
    <p>Omzet: Rp ${Math.round(omzet).toLocaleString()}</p>
    <p>Modal: Rp ${Math.round(modal).toLocaleString()}</p>
    <p><b>Profit: Rp ${Math.round(profit).toLocaleString()}</b></p>
  `;
}

/* ===== RESET ===== */
function resetLaporan(){
  if(confirm("Reset hari ini?")){
    riwayat=[];
    saveAll();
    renderLaporan();
  }
}

/* ===== SISA STOK ===== */
function tampilSisa(){
  let html="";
  stok.forEach(s=>{
    html+=`<p>${s.nama}: ${s.qty} ${s.satuan}</p>`;
  });
  document.getElementById("sisaStok").innerHTML=html;
}

/* ===== INIT ===== */
renderStok();
renderProduk();
renderResep();
tampilSisa();
renderLaporan();
</script>

</body>
</html>
